<div class="edit-favorites-container">
	<a routerLink="/" class="back-link" style="margin-bottom: 1rem; display: inline-block; color: var(--accent); text-decoration: underline;">← Back to Search</a>
	<h2>Edit Favorites</h2>
	<!-- Export section: user inputs Chhakka and can export all favorites -->
	<div class="export-section" style="margin: 1rem 0;">
		<label for="chhakka-input">Chhakka:</label>
		<input id="chhakka-input" type="text" [(ngModel)]="chhakka" placeholder="Enter Chhakka" style="margin-left: 0.5rem;" />
		<button type="button" (click)="exportFavorites()" style="margin-left: 0.5rem;" [disabled]="favorites.length === 0">Export Favorites</button>
	</div>
	<!-- Error message for empty Chhakka -->
	<div *ngIf="showChhakkaError" class="error-message" style="color: #e57373; margin: 0.5rem 0; font-size: 0.9rem;">
		Please enter a Chhakka value before exporting.
	</div>
	<p *ngIf="favorites.length === 0">No favorites saved.</p>
	<div
		cdkDropList
		class="favorites-list"
		(cdkDropListDropped)="onDrop($event)"
	>
		<div
			*ngFor="let fav of favorites; let i = index"
			cdkDrag
			class="favorite-item"
		>
			<span class="drag-handle" cdkDragHandle>☰</span>
			<!-- Serial number for each favorite -->
			<span class="favorite-index">{{ i + 1 }}.&nbsp;</span>
			<span class="favorite-text">
				{{ fav.Gurmukhi || fav.Punjabi || 'Unnamed favorite' }}
			</span>
			<!-- Action buttons for each favorite -->
			<span class="favorite-actions">
				<button type="button" (click)="removeFavorite(i)" title="Remove favorite">✖</button>
				<button type="button" (click)="moveToTop(i)" title="Move to top">⬆️</button>
				<button type="button" (click)="moveToBottom(i)" title="Move to bottom">⬇️</button>
			</span>
		</div>
	</div>
</div>
